<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Stardew Tracker · Katie</title>
<style>
:root {
  --bg:#0f1419; --panel:#1a2332; --panel2:#243044; --text:#e8eef7; --muted:#9aa8bc;
  --accent:#7ec8a3; --accent2:#f0c674; --border:#2e3a4d; --bar:#2a384c; --barfill:#05df72;
  --danger:#e07a7a; --chip:#2a3548;
  --done-bg:#0a1c10; --done-border:#075023; --done-check:#dbfce7; --done-meta:#aeccb9;
  --mid-bg:#221a08; --mid-border:#604805;
}
* { box-sizing: border-box; }
body {
  margin:0; font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
  background: var(--bg); color: var(--text); line-height:1.35;
}
header {
  position: sticky; top:0; z-index:20; background: rgba(15,20,25,.94);
  backdrop-filter: blur(8px); border-bottom:1px solid var(--border);
  padding:12px 16px 0;
}
h1 { margin:0 0 8px; font-size:1.15rem; font-weight:700; letter-spacing:.02em; }
.tabs { display:flex; gap:4px; overflow-x:auto; padding-bottom:0; }
.tab {
  background:transparent; border:none; color:var(--muted); padding:10px 14px;
  cursor:pointer; font: inherit; font-weight:600; border-bottom:2px solid transparent;
  white-space:nowrap;
}
.tab.active { color:var(--accent); border-bottom-color:var(--accent); }
.toolbar {
  display:flex; flex-wrap:wrap; gap:8px; align-items:center;
  padding:10px 16px; border-bottom:1px solid var(--border); background:var(--bg);
}
.toolbar label { font-size:.85rem; color:var(--muted); }
select, button.btn {
  background:var(--panel); color:var(--text); border:1px solid var(--border);
  border-radius:8px; padding:6px 10px; font:inherit;
}
button.btn { cursor:pointer; }
button.btn:hover { border-color:var(--accent); }
.seg { display:inline-flex; border:1px solid var(--border); border-radius:8px; overflow:hidden; }
.seg button {
  background:var(--panel); color:var(--muted); border:none; padding:6px 12px;
  cursor:pointer; font:inherit; font-weight:600;
}
.seg button.on { background:var(--accent); color:#0b1510; }
main { padding:16px; max-width:1180px; margin:0 auto; }
.card {
  background:var(--panel); border:1px solid var(--border); border-radius:14px;
  padding:14px 16px; margin-bottom:12px;
}
.card h2 { margin:0 0 8px; font-size:1rem; }
.card h3 { margin:12px 0 6px; font-size:.92rem; color:var(--accent2); font-weight:600; }
.prog-wrap { display:flex; align-items:center; gap:10px; margin-bottom:8px; }
.prog {
  flex:1; height:8px; background:var(--bar); border-radius:99px; overflow:hidden;
}
.prog > span { display:block; height:100%; background:var(--barfill); width:0%; transition:width .15s; }
.prog-label { font-size:.8rem; color:var(--muted); min-width:4.5rem; text-align:right; }
.list { display:grid; gap:2px; }
.row {
  display:grid; grid-template-columns:22px 1fr auto; gap:8px; align-items:start;
  padding:6px 8px; border-radius:8px;
}
.row:hover { background:var(--panel2); }
.row input { margin-top:3px; accent-color:var(--accent); width:16px; height:16px; }
.row .name { font-size:.92rem; }
.row .meta { font-size:.78rem; color:var(--muted); }
.row.done .name { color:var(--muted); text-decoration:line-through; }
.chip {
  display:inline-block; font-size:.7rem; background:var(--chip); color:var(--muted);
  border-radius:999px; padding:2px 7px; margin-left:6px; vertical-align:middle;
}
.star { color:var(--accent2); font-weight:700; }
.hidden { display:none !important; }
.room-grid { display:grid; gap:12px; }
@media (min-width:800px) {
  .museum-grid { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
}
textarea {
  width:100%; min-height:220px; background:var(--panel2); color:var(--text);
  border:1px solid var(--border); border-radius:10px; padding:12px; font:inherit;
  resize:vertical;
}
.foot { color:var(--muted); font-size:.75rem; padding:8px 16px 24px; text-align:center; }
.search {
  flex:1; min-width:140px; background:var(--panel); color:var(--text);
  border:1px solid var(--border); border-radius:8px; padding:6px 10px; font:inherit;
}

.toolbar-page { display:block; padding:16px 16px 8px; border-bottom:none; }
.toolbar-inner { max-width:1180px; margin:0 auto; display:flex; flex-direction:column; gap:10px; }
.page-head { display:flex; flex-direction:column; align-items:stretch; gap:6px; }
.page-title { margin:0; font-size:1.55rem; font-weight:700; letter-spacing:.01em; }
.page-prog { margin:0; }
.page-prog .prog-label { min-width:auto; white-space:nowrap; font-size:.85rem; }
.toolbar-row { display:flex; flex-wrap:wrap; gap:10px 14px; align-items:center; }
.pills { display:inline-flex; flex-wrap:wrap; gap:6px; align-items:center; }
.pills button {
  background:var(--panel); color:var(--text); border:1px solid var(--border);
  border-radius:999px; padding:5px 12px; font:inherit; font-size:.85rem; font-weight:600;
  cursor:pointer;
}
.pills button:hover { border-color:#5a6a80; }
.pills button.on {
  background:var(--panel2); color:var(--text); border-color:#5a6a80;
}
.pill-label { font-size:.85rem; color:var(--muted); margin-right:2px; }
.pills button.pill-x { padding:5px 10px; color:var(--muted); min-width:2rem; }
.search-full { width:100%; flex:1 1 100%; border-radius:12px; padding:10px 14px; }
.note-meta { color:var(--muted); font-size:.8rem; }
.section-title { margin:22px 0 10px; font-size:1.15rem; font-weight:700; }
.section-title:first-child { margin-top:0; }
.section-title .chip { margin-left:8px; vertical-align:middle; }
.bundle-grid, .item-card-grid { display:grid; grid-template-columns:1fr; gap:10px; margin:0 0 6px; align-items:start; }
@media (min-width:800px) {
  .bundle-grid, .item-card-grid { grid-template-columns:1fr 1fr 1fr; }
}
.bcard {
  background:var(--panel); border:1px solid var(--border); border-radius:14px;
  padding:12px 14px; cursor:pointer;
}
.bcard.complete { background:var(--done-bg); border-color:var(--done-border); }
.bcard-head { display:flex; align-items:center; gap:8px; }
.bcard-titles { flex:1; min-width:0; }
.bcard-name { font-weight:700; }
.bcard-sub { font-size:.8rem; color:var(--muted); margin-top:2px; }
.bcard.complete .bcard-sub { color:var(--done-meta); }
.bcard-tick {
  color:var(--done-check); font-size:1.05rem; font-weight:700; line-height:1;
  visibility:hidden; flex-shrink:0;
}
.bcard.complete .bcard-tick { visibility:visible; }
.bcard-count {
  font-size:.72rem; color:var(--muted); border:1px solid var(--border);
  border-radius:999px; padding:2px 7px; flex-shrink:0;
}
.bcard.complete .bcard-count { display:none; }
.bcard-chevron {
  width:7px; height:7px; border-right:2px solid var(--muted); border-bottom:2px solid var(--muted);
  transform:rotate(-45deg); margin:0 4px 2px; flex-shrink:0; transition:transform .15s;
}
.bcard.open .bcard-chevron { transform:rotate(45deg); margin-bottom:0; }
.bcard-items { display:none; margin-top:8px; border-top:1px solid var(--border); }
.bcard.open .bcard-items { display:block; }
.item-row {
  display:flex; align-items:center; gap:8px; padding:9px 2px;
  border-bottom:1px solid var(--border); cursor:pointer;
}
.item-row:last-child { border-bottom:none; }
.item-row .name { flex:1; min-width:0; font-size:.92rem; }
.item-row .meta { font-size:.78rem; color:var(--muted); margin-top:2px; }
.item-row.done .name { color:var(--muted); }
.item-row input { margin-left:auto; flex-shrink:0; accent-color:var(--barfill); width:16px; height:16px; }
.scard {
  display:flex; align-items:flex-start; gap:8px; background:var(--panel);
  border:1px solid var(--border); border-radius:14px; padding:12px 14px; cursor:pointer;
}
.scard.complete { background:var(--done-bg); border-color:var(--done-border); }
.scard .scard-body { flex:1; min-width:0; }
.scard .name { font-weight:600; font-size:.92rem; }
.scard .meta { font-size:.78rem; color:var(--muted); margin-top:2px; }
.scard.complete .meta { color:var(--done-meta); }
.scard input { margin-left:auto; flex-shrink:0; accent-color:var(--barfill); width:16px; height:16px; margin-top:2px; }
.empty-note { color:var(--muted); padding:8px 0; }
</style>
</head>
<body>
<header>
  <h1>Stardew Tracker</h1>
  <nav class="tabs" id="tabs">
    <button class="tab active" data-tab="bundles">Bundles</button>
    <button class="tab" data-tab="museum">Museum</button>
    <button class="tab" data-tab="recipes">Recipes</button>
    <button class="tab" data-tab="seasons">Seasons</button>
    <button class="tab" data-tab="notes">Notes</button>
  </nav>
</header>

<section class="toolbar toolbar-page" id="toolbar-bundles">
  <div class="toolbar-inner">
    <div class="page-head">
      <h2 class="page-title">Bundles</h2>
      <div class="prog-wrap page-prog">
        <div class="prog" id="bundlesProg"><span></span></div>
        <div class="prog-label" id="bundlesProgLabel">0 of 0 bundles complete</div>
      </div>
    </div>
    <div class="toolbar-row">
      <div class="pills" id="modeSeg">
        <button type="button" data-mode="bbb" class="on">BBB</button>
        <button type="button" data-mode="vanilla">Vanilla</button>
      </div>
      <div class="pills" id="seasonPills">
        <span class="pill-label">Season</span>
        <button type="button" data-season="any">Any / all</button>
        <button type="button" data-season="1">Spring</button>
        <button type="button" data-season="2">Summer</button>
        <button type="button" data-season="3">Fall</button>
        <button type="button" data-season="4">Winter</button>
        <button type="button" class="pill-x" data-season="any" title="Clear" aria-label="Clear season">×</button>
      </div>
    </div>
    <input class="search search-full" id="bundleSearch" placeholder="Search bundles, rooms, or items" type="search">
  </div>
</section>

<section class="toolbar hidden" id="toolbar-museum">
  <div class="prog-wrap" style="flex:1;margin:0">
    <div class="prog" id="museumProg"><span></span></div>
    <div class="prog-label" id="museumProgLabel">0/0</div>
  </div>
  <input class="search" id="museumSearch" placeholder="Filter…" type="search">
</section>

<section class="toolbar hidden" id="toolbar-recipes">
  <div class="prog-wrap" style="flex:1;margin:0">
    <div class="prog" id="recipesProg"><span></span></div>
    <div class="prog-label" id="recipesProgLabel">0/0</div>
  </div>
  <input class="search" id="recipeSearch" placeholder="Filter person or recipe…" type="search">
</section>

<section class="toolbar toolbar-page hidden" id="toolbar-seasons">
  <div class="toolbar-inner">
    <div class="page-head">
      <h2 class="page-title">Seasons</h2>
      <div class="prog-wrap page-prog">
        <div class="prog" id="seasonsProg"><span></span></div>
        <div class="prog-label" id="seasonsProgLabel">0 of 0 checked</div>
      </div>
    </div>
    <div class="toolbar-row">
      <div class="pills" id="seasonPickPills">
        <span class="pill-label">Season</span>
        <button type="button" data-season="Spring">Spring</button>
        <button type="button" data-season="Summer">Summer</button>
        <button type="button" data-season="Fall">Fall</button>
        <button type="button" data-season="Winter">Winter</button>
      </div>
      <span class="note-meta">★ = also in a Community Center bundle (follows the BBB / Vanilla setting on Bundles)</span>
    </div>
    <input class="search search-full" id="seasonSearch" placeholder="Search items or deadlines" type="search">
  </div>
</section>

<section class="toolbar hidden" id="toolbar-notes">
  <button class="btn" type="button" id="clearNotes">Clear notes</button>
  <span style="color:var(--muted);font-size:.8rem">Saved on this device</span>
</section>

<main>
  <div id="view-bundles"></div>
  <div id="view-museum" class="museum-grid hidden"></div>
  <div id="view-recipes" class="hidden"></div>
  <div id="view-seasons" class="hidden"></div>
  <div id="view-notes" class="hidden">
    <div class="card">
      <h2>Notes / to-do</h2>
      <textarea id="notesBox" placeholder="Pull list, reminders, whatever you need mid-game…"></textarea>
    </div>
  </div>
</main>
<p class="foot">Offline · data from start packet / BBB CSV · checks stay in this browser</p>

const LS_CHECKS = 'sv-tracker-checks';
const LS_NOTES = 'sv-tracker-notes';
const LS_MODE = 'sv-tracker-mode';
const LS_SEASON = 'sv-tracker-season';
const LS_SEASON_PICK = 'sv-tracker-season-pick';

function loadChecks() {
  try { return JSON.parse(localStorage.getItem(LS_CHECKS) || '{}'); } catch { return {}; }
}
function saveChecks(c) { localStorage.setItem(LS_CHECKS, JSON.stringify(c)); }
let checks = loadChecks();

function cid(...parts) {
  return parts.map(p => String(p).toLowerCase().replace(/[^a-z0-9]+/g, '-')).join(':');
}
function isChecked(id) { return !!checks[id]; }
function setChecked(id, v) {
  if (v) checks[id] = true; else delete checks[id];
  saveChecks(checks);
}

function seasonMatch(itemSeason, filter) {
  if (filter === 'any') return true;
  const s = String(itemSeason || 'any');
  if (s === 'any') return true;
  return s.split(',').map(x => x.trim()).includes(filter);
}

function setProg(barEl, labelEl, done, total, phrase) {
  const pct = total ? Math.round(done / total * 100) : 0;
  barEl.querySelector('span').style.width = pct + '%';
  labelEl.textContent = phrase || (done + '/' + total);
}

const SEASON_NAMES = { '1':'Spring', '2':'Summer', '3':'Fall', '4':'Winter' };
function seasonLabel(s) {
  if (!s || s === 'any') return '';
  return String(s).split(',').map(x => SEASON_NAMES[x.trim()] || x.trim()).join(', ');
}
function inActiveBundles(name) {
  const raw = String(name || '');
  const base = raw.replace(/\s*[×xX]\s*\d+.*$/, '').replace(/\s*\(.*\)$/, '').trim();
  return DATA.bundles.some(b => {
    if (mode !== 'bbb' && !b.vanilla) return false;
    return b.item === raw || b.item === base;
  });
}
function modeItems() {
  return DATA.bundles.filter(b => mode === 'bbb' || b.vanilla);
}
function firstSeen(rows, key, pred) {
  const out = [];
  const seen = new Set();
  for (const r of rows) {
    if (pred && !pred(r)) continue;
    const v = r[key];
    if (!seen.has(v)) { seen.add(v); out.push(v); }
  }
  return out;
}
function countBundlesComplete() {
  const groups = new Map();
  for (const it of modeItems()) {
    const k = it.room + '\0' + it.bundle;
    if (!groups.has(k)) groups.set(k, []);
    groups.get(k).push(it);
  }
  let done = 0;
  for (const list of groups.values()) {
    if (list.every(it => isChecked(cid('b', it.room, it.bundle, it.item, it.qty)))) done++;
  }
  return { done, total: groups.size };
}
function updateBundlesProg() {
  const { done, total } = countBundlesComplete();
  setProg(document.getElementById('bundlesProg'), document.getElementById('bundlesProgLabel'), done, total,
    done + ' of ' + total + ' bundles complete');
}

    views[k].classList.toggle('hidden', k !== tab);
    toolbars[k].classList.toggle('hidden', k !== tab);

function renderBundles() {
  const root = views.bundles;
  root.innerHTML = '';
  const q = (document.getElementById('bundleSearch').value || '').trim().toLowerCase();
  let items = modeItems();
  items = items.filter(b => seasonMatch(b.season, seasonFilter));
  if (q) items = items.filter(b => (b.item + ' ' + b.bundle + ' ' + b.room).toLowerCase().includes(q));

  const rooms = new Map();
  for (const b of items) {
    if (!rooms.has(b.room)) rooms.set(b.room, new Map());
    const bm = rooms.get(b.room);
    if (!bm.has(b.bundle)) bm.set(b.bundle, []);
    bm.get(b.bundle).push(b);
  }
  const roomNames = firstSeen(DATA.bundles, 'room').filter(r => rooms.has(r));
  if (!roomNames.length) {
    const empty = document.createElement('p');
    empty.className = 'empty-note';
    empty.textContent = 'No bundles match these filters.';
    root.appendChild(empty);
    updateBundlesProg();
    return;
  }

  for (const room of roomNames) {
    const heading = document.createElement('h2');
    heading.className = 'section-title';
    heading.textContent = room;
    root.appendChild(heading);

    const grid = document.createElement('div');
    grid.className = 'bundle-grid';
    const bundles = rooms.get(room);
    const bundleNames = firstSeen(DATA.bundles, 'bundle', r => r.room === room).filter(n => bundles.has(n));

    for (const bn of bundleNames) {
      const list = bundles.get(bn).slice().sort((a,b) => a.item.localeCompare(b.item));
      let nDone = 0;
      for (const it of list) {
        if (isChecked(cid('b', it.room, it.bundle, it.item, it.qty))) nDone++;
      }
      const allDone = nDone === list.length && list.length > 0;
      const card = document.createElement('div');
      card.className = 'bcard' + (allDone ? ' complete' : '');

      const head = document.createElement('div');
      head.className = 'bcard-head';
      head.innerHTML = `<div class="bcard-titles">
          <div class="bcard-name">${esc(bn)}</div>
          <div class="bcard-sub">${nDone} of ${list.length} items complete</div>
        </div>
        <span class="bcard-tick" aria-hidden="true">✓</span>
        <span class="bcard-count">${nDone}/${list.length}</span>
        <span class="bcard-chevron" aria-hidden="true"></span>`;

      const body = document.createElement('div');
      body.className = 'bcard-items';
      for (const it of list) {
        const id = cid('b', it.room, it.bundle, it.item, it.qty);
        const checked = isChecked(id);
        const row = document.createElement('label');
        row.className = 'item-row' + (checked ? ' done' : '');
        const qtyBit = it.qty ? ' \u00d7' + it.qty : '';
        const sl = seasonLabel(it.season);
        const vanillaChip = (it.vanilla && mode==='bbb') ? '<span class="chip">vanilla</span>' : '';
        row.innerHTML = `<span class="name">${esc(it.item)}${esc(qtyBit)}${vanillaChip}${sl ? '<div class="meta">' + esc(sl) + '</div>' : ''}</span>
          <input type="checkbox" ${checked?'checked':''}>`;
        const cb = row.querySelector('input');
        cb.addEventListener('click', ev => ev.stopPropagation());
        cb.addEventListener('change', () => {
          setChecked(id, cb.checked);
          row.classList.toggle('done', cb.checked);
          const cbs = card.querySelectorAll('.item-row input');
          let d = 0;
          cbs.forEach(c => { if (c.checked) d++; });
          const sub = card.querySelector('.bcard-sub');
          const count = card.querySelector('.bcard-count');
          if (sub) sub.textContent = d + ' of ' + cbs.length + ' items complete';
          if (count) count.textContent = d + '/' + cbs.length;
          card.classList.toggle('complete', d === cbs.length && cbs.length > 0);
          updateBundlesProg();
        });
        body.appendChild(row);
      }
      card.appendChild(head);
      card.appendChild(body);
      card.addEventListener('click', e => {
        if (e.target.closest('input') || e.target.closest('label.item-row')) return;
        card.classList.toggle('open');
      });
      grid.appendChild(card);
    }
    root.appendChild(grid);
  }
  if (new URLSearchParams(location.search).get('expand') === '1') {
    const first = root.querySelector('.bcard');
    if (first) first.classList.add('open');
  }
  updateBundlesProg();
}

document.getElementById('museumSearch').addEventListener('input', renderMuseum);

function renderMuseum() {
  const root = views.museum;
  root.innerHTML = '';
  const q = (document.getElementById('museumSearch').value || '').trim().toLowerCase();
  let total = 0, done = 0;
  for (const [key, title] of [['artifacts','Artifacts'],['minerals','Minerals']]) {
    let list = DATA.museum[key].slice().sort((a,b) => a.name.localeCompare(b.name));
    if (q) list = list.filter(x => (x.name + ' ' + x.where).toLowerCase().includes(q));
    const card = document.createElement('div');
    card.className = 'card';
    let cDone = 0;
    const ul = document.createElement('div');
    ul.className = 'list';
    for (const it of list) {
      const id = cid('m', key, it.name);
      const checked = isChecked(id);
      total++; if (checked) { done++; cDone++; }
      const row = document.createElement('label');
      row.className = 'row' + (checked ? ' done' : '');
      row.innerHTML = `<input type="checkbox" ${checked?'checked':''}>
        <span class="name">${esc(it.name)}<div class="meta">${esc(it.where)}</div></span><span></span>`;
      row.querySelector('input').addEventListener('change', e => {
        setChecked(id, e.target.checked);
        row.classList.toggle('done', e.target.checked);
        renderMuseum();
      });
      ul.appendChild(row);
    }
    card.innerHTML = `<h2>${title}</h2>
      <div class="prog-wrap"><div class="prog"><span style="width:${list.length?Math.round(cDone/list.length*100):0}%"></span></div>
      <div class="prog-label">${cDone}/${list.length}</div></div>`;
    card.appendChild(ul);
    root.appendChild(card);
  }
  setProg(document.getElementById('museumProg'), document.getElementById('museumProgLabel'), done, total);
}

function renderRecipes() {
  const root = views.recipes;
  root.innerHTML = '';
  const q = (document.getElementById('recipeSearch').value || '').trim().toLowerCase();
  let list = DATA.recipes.slice().sort((a,b) =>
    a.person.localeCompare(b.person) || a.hearts - b.hearts || a.recipe.localeCompare(b.recipe));
  if (q) list = list.filter(r => (r.person + ' ' + r.recipe + ' ' + r.how).toLowerCase().includes(q));

  const byPerson = new Map();
  for (const r of list) {
    if (!byPerson.has(r.person)) byPerson.set(r.person, []);
    byPerson.get(r.person).push(r);
  }
  let total = 0, done = 0;
  const card = document.createElement('div');
  card.className = 'card';
  card.innerHTML = '<h2>Relationship recipes</h2>';
  const body = document.createElement('div');
  for (const person of [...byPerson.keys()].sort((a,b)=>a.localeCompare(b))) {
    const h = document.createElement('h3');
    h.textContent = person;
    body.appendChild(h);
    const ul = document.createElement('div');
    ul.className = 'list';
    for (const r of byPerson.get(person)) {
      const id = cid('r', r.person, r.recipe, r.hearts);
      const checked = isChecked(id);
      total++; if (checked) done++;
      const kind = r.kind === 'craft' ? 'crafting' : 'cooking';
      const row = document.createElement('label');
      row.className = 'row' + (checked ? ' done' : '');
      row.innerHTML = `<input type="checkbox" ${checked?'checked':''}>
        <span class="name">${esc(r.recipe)}${r.sve?'<span class="chip">SVE</span>':''}<span class="chip">${kind}</span>
          <div class="meta">${r.hearts}♥ · ${esc(r.how)}</div></span><span></span>`;
      row.querySelector('input').addEventListener('change', e => {
        setChecked(id, e.target.checked);
        row.classList.toggle('done', e.target.checked);
        recountRecipes();
      });
      ul.appendChild(row);
    }
    body.appendChild(ul);
  }
  card.appendChild(body);
  root.appendChild(card);
  setProg(document.getElementById('recipesProg'), document.getElementById('recipesProgLabel'), done, total);
}
function recountRecipes() {
  const rows = views.recipes.querySelectorAll('.row input');
  let d=0; rows.forEach(c=>{ if(c.checked) d++; });
  setProg(document.getElementById('recipesProg'), document.getElementById('recipesProgLabel'), d, rows.length);
}

/* ---- Seasons ---- */
let seasonPick = localStorage.getItem(LS_SEASON_PICK) || 'Spring';

function syncSeasonPickPills() {
  document.querySelectorAll('#seasonPickPills button[data-season]').forEach(x => {
    x.classList.toggle('on', x.dataset.season === seasonPick);
  });
}
document.getElementById('seasonPickPills').addEventListener('click', e => {
  const b = e.target.closest('button[data-season]');
  if (!b) return;
  seasonPick = b.dataset.season;
  localStorage.setItem(LS_SEASON_PICK, seasonPick);
  syncSeasonPickPills();
  renderSeasons();
});
syncSeasonPickPills();
document.getElementById('seasonSearch').addEventListener('input', renderSeasons);

function updateSeasonsProg(done, total) {
  setProg(document.getElementById('seasonsProg'), document.getElementById('seasonsProgLabel'), done, total,
    done + ' of ' + total + ' checked');
}

function renderSeasons() {
  const root = views.seasons;
  root.innerHTML = '';
  const s = DATA.seasons[seasonPick];
  if (!s) return;
  const q = (document.getElementById('seasonSearch').value || '').trim().toLowerCase();
  let done = 0, total = 0;

  function addSection(title, items, makeId, makeMeta, isSve) {
    const heading = document.createElement('h2');
    heading.className = 'section-title';
    heading.textContent = title;
    if (isSve) {
      const chip = document.createElement('span');
      chip.className = 'chip';
      chip.textContent = 'SVE';
      heading.appendChild(chip);
    }
    root.appendChild(heading);
    if (!items.length) return;
    const grid = document.createElement('div');
    grid.className = 'item-card-grid';
    for (const it of items) {
      const id = makeId(it);
      const checked = isChecked(id);
      total++;
      if (checked) done++;
      const card = document.createElement('label');
      card.className = 'scard' + (checked ? ' complete' : '');
      const meta = makeMeta(it);
      card.innerHTML = `<span class="scard-body"><span class="name">${it._star ? '<span class="star">★ </span>' : ''}${esc(it._name)}</span>
        ${meta ? '<div class="meta">' + esc(meta) + '</div>' : ''}</span>
        <input type="checkbox" ${checked?'checked':''}>`;
      card.querySelector('input').addEventListener('change', e => {
        setChecked(id, e.target.checked);
        card.classList.toggle('complete', e.target.checked);
        const cbs = root.querySelectorAll('.scard input');
        let d = 0;
        cbs.forEach(c => { if (c.checked) d++; });
        updateSeasonsProg(d, cbs.length);
      });
      grid.appendChild(card);
    }
    root.appendChild(grid);
  }

  let deadlines = s.deadlines.slice().sort((a,b) => a.item.localeCompare(b.item));
  if (q) deadlines = deadlines.filter(it => (it.item + ' ' + it.bundle + ' ' + it.note).toLowerCase().includes(q));
  addSection('Bundle deadlines', deadlines.map(it => Object.assign({}, it, {
    _name: it.item,
    _star: !!(it.star || inActiveBundles(it.item))
  })), it => cid('s', seasonPick, 'dl', it.item, it.bundle), it => [it.bundle, it.note].filter(Boolean).join(' · '), false);

  function prep(arr) {
    let list = arr.slice().sort((a,b) => a.name.localeCompare(b.name));
    if (q) list = list.filter(it => (it.name + ' ' + (it.extra || '')).toLowerCase().includes(q));
    return list.map(it => Object.assign({}, it, { _name: it.name, _star: inActiveBundles(it.name) }));
  }
  function extraMeta(it) { return it.extra || ''; }

  addSection('Crops (vanilla)', prep(s.crops_v), it => cid('s', seasonPick, 'cv', it.name), extraMeta, false);
  addSection('Crops (SVE)', prep(s.crops_sve), it => cid('s', seasonPick, 'cs', it.name), extraMeta, true);
  addSection('Fish (vanilla)', prep(s.fish_v), it => cid('s', seasonPick, 'fv', it.name), extraMeta, false);
  addSection('Fish (SVE)', prep(s.fish_sve), it => cid('s', seasonPick, 'fs', it.name), extraMeta, true);
  addSection('Forage (vanilla)', prep(s.forage_v), it => cid('s', seasonPick, 'fov', it.name), extraMeta, false);
  addSection('Forage (SVE)', prep(s.forage_sve), it => cid('s', seasonPick, 'fos', it.name), extraMeta, true);

  updateSeasonsProg(done, total);
}

/* ---- Notes ---- */
const notesBox = document.getElementById('notesBox');
notesBox.value = localStorage.getItem(LS_NOTES) || '';
let notesTimer = null;
notesBox.addEventListener('input', () => {
  clearTimeout(notesTimer);
  notesTimer = setTimeout(() => localStorage.setItem(LS_NOTES, notesBox.value), 200);
});
document.getElementById('clearNotes').addEventListener('click', () => {
  if (!confirm('Clear notes?')) return;
  notesBox.value = '';
  localStorage.setItem(LS_NOTES, '');
});

function esc(s) {
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

renderBundles();
renderMuseum();
renderRecipes();
renderSeasons();
(function initTab() {
  const q = new URLSearchParams(location.search).get('tab');
  const h = (location.hash || '').replace(/^#/, '');
  const tab = q || h;
  if (tab && views[tab]) activateTab(tab);
})();
</script>
